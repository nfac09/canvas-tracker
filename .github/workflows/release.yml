# Canvas Tracker — Automated release workflow
#
# Triggers when a version tag (v*) is pushed to GitHub.
# Builds macOS and Windows installers in parallel, then publishes the release.
#
# Normal usage (from your terminal in the project root):
#   npm run release          # patch: 1.0.0 → 1.0.1
#   npm run release:minor    # minor: 1.0.0 → 1.1.0
#   npm run release:major    # major: 1.0.0 → 2.0.0
#
# Output artifacts uploaded to the GitHub Release:
#   macOS (Apple Silicon) : Canvas Tracker-X.Y.Z-arm64.dmg
#   macOS (Intel)         : Canvas Tracker-X.Y.Z.dmg
#   Windows               : Canvas Tracker Setup X.Y.Z.exe  (x64)

name: Release

on:
  push:
    tags:
      - 'v*'

# Required for electron-builder to create GitHub releases and upload assets
permissions:
  contents: write

jobs:
  # ── macOS build (.dmg) ──────────────────────────────────────────────────────
  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # package.json carries identity:null / hardenedRuntime:false / notarize:false
      # to prevent codesign from running locally (com.apple.provenance on APFS
      # makes codesign fail on macOS Sequoia+ developer machines).
      #
      # On CI, signing is only unlocked when a real Developer ID certificate is
      # present (CSC_LINK secret).  Without it, the build remains unsigned —
      # identical to local behaviour, and the build succeeds cleanly.
      #
      # Secrets needed for full signed + notarized release quality:
      #   CSC_LINK                     base64-encoded Developer ID Application .p12
      #   CSC_KEY_PASSWORD             password for the .p12
      #   APPLE_ID                     your Apple ID email (for notarization)
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID                10-char Team ID from developer.apple.com
      #
      # Without CSC_LINK: unsigned build (users bypass Gatekeeper on first launch).
      # With CSC_LINK only: signed, Gatekeeper-trusted, auto-update works.
      # With all five secrets: signed + notarized, no warnings on any macOS version.
      - name: Configure signing and notarization for CI
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const hasCert = !!process.env.CSC_LINK;

            // ALWAYS remove identity:null on CI.
            //
            // With identity:null electron-builder skips codesign entirely, so
            // every binary ships with its original linker-applied ad-hoc
            // signature (flags=adhoc,linker-signed). Linker signatures do not
            // seal the bundle: Info.plist is unbound and Sealed Resources is
            // empty. macOS Gatekeeper then fails codesign --verify with
            // 'code has no resources but signature indicates they must be
            // present' and shows 'damaged' — which xattr stripping cannot fix
            // because the problem is an invalid signature, not quarantine.
            //
            // Removing the override lets electron-builder run codesign --sign -
            // on every binary, replacing linker signatures with proper bundle-
            // aware ad-hoc signatures. The resulting app passes codesign --verify
            // and opens normally after quarantine removal.
            //
            // hardenedRuntime stays false unless a real cert is present, so
            // codesign runs as: codesign --sign - --force <binary>
            // No timestamp server, no entitlements, no --options runtime needed.
            delete pkg.build.mac.identity;

            if (hasCert) {
              // Real Developer ID cert present — enable hardened runtime for
              // notarization compatibility.
              pkg.build.mac.hardenedRuntime = true;
            }

            pkg.build.mac.notarize = hasCert && process.env.APPLE_TEAM_ID
              ? { teamId: process.env.APPLE_TEAM_ID }
              : false;

            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build and publish macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prefix signing secrets so they are never passed as empty strings to
          # electron-builder.  An unset GitHub secret evaluates to "" here, and
          # electron-builder treats any non-null CSC_LINK (even "") as a cert
          # load attempt, requiring CSC_KEY_PASSWORD and failing.
          # The run step below exports the unprefixed names only when non-empty.
          _CSC_LINK: ${{ secrets.CSC_LINK }}
          _CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$_CSC_LINK" ]                     && export CSC_LINK="$_CSC_LINK"
          [ -n "$_CSC_KEY_PASSWORD" ]              && export CSC_KEY_PASSWORD="$_CSC_KEY_PASSWORD"
          [ -n "$_APPLE_ID" ]                      && export APPLE_ID="$_APPLE_ID"
          [ -n "$_APPLE_APP_SPECIFIC_PASSWORD" ]   && export APPLE_APP_SPECIFIC_PASSWORD="$_APPLE_APP_SPECIFIC_PASSWORD"
          [ -n "$_APPLE_TEAM_ID" ]                 && export APPLE_TEAM_ID="$_APPLE_TEAM_ID"
          npx tsc -b && npx vite build && npx electron-builder --mac --publish always

  # ── Windows build (.exe) ────────────────────────────────────────────────────
  build-win:
    name: Build Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: npx tsc -b && npx vite build && npx electron-builder --win --publish always

  # ── Finalize release ────────────────────────────────────────────────────────
  # Waits for both builds to succeed, then converts the draft release to
  # published so users see a complete release with all platform artifacts.
  finalize-release:
    name: Publish release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Promote draft to published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
